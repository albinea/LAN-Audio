<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAN Audio Host</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#10131a;color:#f2f4f8}main{width:min(92vw,520px);padding:24px;border:1px solid #343b49;border-radius:20px;background:#191e28}h1{margin:0 0 8px}p{color:#bdc5d4;line-height:1.5}.qr{display:block;width:min(72vw,260px);height:auto;margin:18px auto;padding:10px;background:white;border-radius:12px}.count{font-size:1.2rem;font-weight:700;padding:14px;background:#10131a;border-radius:12px;text-align:center}code{overflow-wrap:anywhere}</style></head><body><main><h1>LAN Audio</h1><p>Connect phones to this laptop's hotspot, then scan this QR code.</p><img class="qr" src="/qr.png" alt="QR code to join LAN Audio"><div class="count" id="count">Connected listeners: checking…</div><p>Listener URL: <code id="url"></code></p><p>System-output audio only. Microphone is not used.</p></main><script>
const url=`http://${location.host}/listen`;document.querySelector('#url').textContent=url;async function refresh(){try{const r=await fetch('/health',{cache:'no-store'});const d=await r.json();document.querySelector('#count').textContent=`Connected listeners: ${d.connected} / ${d.max_clients}`}catch{document.querySelector('#count').textContent='Status unavailable'}}refresh();setInterval(refresh,1500);
</script></body></html>
